##########################################################################
# CAN@net Basic Configuration
#     File: CONF
#   Source: config.json
#     Date: 2026-04-29  15:54:55
#  Version: 1.0.0
#   Author: 
#   Device: CAN@net Basic V1.00
# ConfType: NanoBasic UDP Server
#
#  TLV Protocol (Little-Endian): 1B Type + 2B Length + Value
#  Commands: 0=Open, 1=Status, 2=StopCAN, 3=InitCAN, 4=StartCAN, 5=Filter, 6=CANrecv(Dev->PC), 7=CANsend, 8=Close
#  FMT bitmask: 0x01=EXT, 0x02=RTR, 0x10=FDF, 0x20=BRS
#  Status response: 3x uint16 (can_sts, tx_free, error_counter)
#  InitCAN value: port(1B) mode(2B) baudA(2B) baudD(2B)
#  Filter: port(1B) fmt(1B) mask(4B) value(4B) — max 5 per format
#  CANsend value: port(1B) fmt(1B) id(4B) data(0-64B)
#  CANrecv value: port(1B) ts_us(4B) fmt(1B) id(4B) data(0-64B)
##########################################################################

### Configuration Identification
cfg_name "TLV CAN-UDP Interface"
cfg_number 1
cfg_type "NanoBasic UDP Server"

##
## List of possible task handles
##
# MainTask                  2
# NanoBasicTask1            3
# MON_MonitoringTask        4
# LED_LedTask               5
# cpu_load_task             6
# USB_UsbTask               7
# UDP_Task                  8
# CFG_ConfigTask            9
# GTW_GatewayTask           13
# SLV_SlaveTask             14
# CAN_CanTask1              16
# CAN_AutoTask1             20
# CFG_PlayerTask            24
# TIM_TimerTask             27
# ABR_AutoBaudrate          28
# EVT_EventTask             31

##
## Init Event module
##
EVT_Init task_hdl=31 list_size=10

##
## Create memory pools
##
MSG_MemPoolCreate num_elems=50 elem_size=128 exp_hdl=1 public=0  # for UDP/CAN-FD msg
MSG_MemPoolCreate num_elems=8 elem_size=256 exp_hdl=2 public=1

##
## Create all necessary applications
##
MON_CREATE inst_num=0 task_hdl=4
UDP_CREATE inst_num=0 task_hdl=8
SLV_CREATE inst_num=0 task_hdl=14

##
## Configure local default routes
##
usb_routing_set inst_num=0 pos=3 topic=0 dest=4
usb_routing_set inst_num=0 pos=4 topic=0 dest=14
usb_routing_set inst_num=0 pos=5 topic=0 dest=3
udp_routing_set inst_num=0 pos=0 topic=0 dest=3


MON_Start inst_num=0
MON_FlushFifo

##
## Init STA module
##
STA_STATE_LED task_hdl=3
STA_STATE_LED task_hdl=14


##
## Initialize CANs via local slave (Part 1)
##
dest task_hdl=14
  can 1 create task_hdl=16
  can 1 create auto task_hdl=20
  can 1 filter create type=std entries=5
  can 1 filter create type=ext entries=5 hashtblsize=9
  can 1 filter create type=maskval entries=5
  can 1 stop
  can 1 init mode=STD baudA=500  iso=ISO


  start
end

##
## Set mailbox limits and mode
##
MSG_MboxSetLimit task_hdl=16 max_entries=40
MSG_MboxSetLimit task_hdl=8 max_entries=20


##
## Initialize ETH module
##
ETH_Start  ip_address="10.41.18.101" netmask="255.255.0.0" gateway="0.0.0.0"

##
## Initialize UDP module
##
UDP_ConfigServer inst_num=0 pool_hdl=1 dest_task=3 udp_port=19236 take_over=1
UDP_Start inst_num=0
UDP_CfgStsMsg inst_num=0 sts_address="225.0.0.250" sts_port=50010 cycle_time=2

##
## Action Rules
##

NBS_Create inst_num=0 task_hdl=3
[[[
' 03: Start CAN after bus-off
' c1: TLV CAN-UDP Server

dim cbuff(19) ' command buffer, enough for CAN-FD TLV
dim pld(15)  ' CAN message payload
ticks = 0

start(ref(cbuff), ref(pld))
cnt03 = 0
tout03 = 0
dim txbufc1(16)
dim rspbufc1(19)
const k_CLNT_TOc1 = 5000
pc_addr = 0
pc_port = 0
last_rxc1 = 0
flt_hdlc1 = 0

while 1
  ticks = ticks + 1

  if cnt03 < 999999999 then
    if tout03 < get_sec() then
      sts = can_sts(1)
      if sts = 4 then ' bus-off
        print "[AR] CAN restarted after bus-off (";str$(cnt03+1) "time)"
        can_recover(1)
        cnt03 = cnt03 + 1
        tout03 = get_sec() + 5
      endif
    endif
  endif

  sleep(100)
loop

on_can:
  hdl = param()
  id = param()
  fmt = param()
  dlc = param()

  if pc_addr <> 0 then
    set1(rspbufc1, 0, 6)
    plenc1 = 10 + dlc
    set2(rspbufc1, 1, plenc1)
    set1(rspbufc1, 3, 1)
    tsc1 = get_usec()
    set4(rspbufc1, 4, tsc1)
    set1(rspbufc1, 8, fmt)
    set4(rspbufc1, 9, id)
    copy(ref(rspbufc1), 13, ref(pld), 0, dlc)
    udp_snd(pc_addr, pc_port, 13 + dlc, ref(rspbufc1))
  endif

  reti

on_cmd:
  cmd = param()

  reti
                        
on_usb:
  cmd = param()

  reti
                        
on_msg:
  size = param()
  addr = param()
  port = param()

  cmdc1 = get1(cbuff, 0)
  mlenc1 = get2(cbuff, 1)
  on cmdc1 + 1 gosub cmdopen, cmdstat, cmdstop, cmdinit, cmdstrt, cmdflt, cmdbad, cmdsend, cmdclos
  last_rxc1 = get_time()

  reti

cmdopen:
  if pc_addr = 0 or tmr_expd(last_rxc1, k_CLNT_TOc1) then
    pc_addr = addr
    pc_port = port
  endif
  set1(rspbufc1, 0, 0)
  set1(rspbufc1, 1, 14)
  set1(rspbufc1, 2, 0)
  set1(rspbufc1, 3, 67)
  set1(rspbufc1, 4, 65)
  set1(rspbufc1, 5, 78)
  set1(rspbufc1, 6, 64)
  set1(rspbufc1, 7, 110)
  set1(rspbufc1, 8, 101)
  set1(rspbufc1, 9, 116)
  set1(rspbufc1, 10, 32)
  set1(rspbufc1, 11, 66)
  set1(rspbufc1, 12, 97)
  set1(rspbufc1, 13, 115)
  set1(rspbufc1, 14, 105)
  set1(rspbufc1, 15, 99)
  set1(rspbufc1, 16, 0)
  udp_snd(addr, port, 17, ref(rspbufc1))
return

cmdstat:
  stsc1 = can_sts(1)
  txfc1 = can_tx_ready()
  errc1 = get_sys(5, 7, 0, 1)
  set1(rspbufc1, 0, 1)
  set1(rspbufc1, 1, 6)
  set1(rspbufc1, 2, 0)
  set2(rspbufc1, 3, stsc1)
  set2(rspbufc1, 5, txfc1)
  set2(rspbufc1, 7, errc1)
  udp_snd(pc_addr, pc_port, 9, ref(rspbufc1))
return

cmdstop:
  portc1 = get1(cbuff, 3)
  if portc1 <> 1 then
    stsc1 = 1
  else
    can_stop(portc1)
    stsc1 = 0
  endif
  set1(rspbufc1, 0, 2)
  set1(rspbufc1, 1, 2)
  set1(rspbufc1, 2, 0)
  set2(rspbufc1, 3, stsc1)
  udp_snd(pc_addr, pc_port, 5, ref(rspbufc1))
return

cmdinit:
  portc1 = get1(cbuff, 3)
  if portc1 <> 1 then
    stsc1 = 1
  else
    modec1 = get2(cbuff, 4)
    baudac1 = get2(cbuff, 6)
    bauddc1 = get2(cbuff, 8)
    can_stop(portc1)
    can_unreg(portc1)
    flt_hdlc1 = 0
    can_init(portc1, modec1, baudac1, bauddc1)
    stsc1 = 0
  endif
  set1(rspbufc1, 0, 3)
  set1(rspbufc1, 1, 2)
  set1(rspbufc1, 2, 0)
  set2(rspbufc1, 3, stsc1)
  udp_snd(pc_addr, pc_port, 5, ref(rspbufc1))
return

cmdstrt:
  portc1 = get1(cbuff, 3)
  if portc1 <> 1 then
    stsc1 = 1
  else
    can_start(portc1)
    stsc1 = 0
  endif
  set1(rspbufc1, 0, 4)
  set1(rspbufc1, 1, 2)
  set1(rspbufc1, 2, 0)
  set2(rspbufc1, 3, stsc1)
  udp_snd(pc_addr, pc_port, 5, ref(rspbufc1))
return

cmdflt:
  portc1 = get1(cbuff, 3)
  if portc1 <> 1 then
    stsc1 = 1
  else
    fmtc1 = get1(cbuff, 4)
    maskc1 = get4(cbuff, 5)
    valc1 = get4(cbuff, 9)
    can_reg(flt_hdlc1 + 100, portc1, fmtc1, valc1, maskc1)
    flt_hdlc1 = flt_hdlc1 + 1
    stsc1 = 0
  endif
  set1(rspbufc1, 0, 5)
  set1(rspbufc1, 1, 2)
  set1(rspbufc1, 2, 0)
  set2(rspbufc1, 3, stsc1)
  udp_snd(pc_addr, pc_port, 5, ref(rspbufc1))
return

cmdbad:
return

cmdsend:
  portc1 = get1(cbuff, 3)
  fmtc1 = get1(cbuff, 4)
  idc1 = get4(cbuff, 5)
  pylen1 = mlenc1 - 6
  if pylen1 >= 0 and pylen1 <= 64 then
    copy(ref(txbufc1), 0, ref(cbuff), 9, pylen1)
    can_send(portc1, idc1, fmtc1, pylen1, ref(txbufc1))
  endif
return

cmdclos:
  pc_addr = 0
  pc_port = 0
return
]]]

##
## Set slave to operational mode
##
dest task_hdl=14
  operational
end
